name: Verify Creative Logic signing backup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stored-signing-key:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Recover and verify original signing key
        shell: bash
        env:
          ENCRYPTED_BACKUP_BASE64: ${{ secrets.CREATIVE_LOGIC_ENCRYPTED_KEYSTORE_BASE64 }}
          BACKUP_PASSPHRASE: ${{ secrets.CREATIVE_LOGIC_BACKUP_PASSPHRASE }}
          KEYSTORE_PASSWORD: ${{ secrets.CREATIVE_LOGIC_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          if [[ -z "${ENCRYPTED_BACKUP_BASE64}" || -z "${BACKUP_PASSPHRASE}" || -z "${KEYSTORE_PASSWORD}" ]]; then
            echo "::error::One or more signing secrets are missing."
            exit 1
          fi

          work="$(mktemp -d "$RUNNER_TEMP/signing-verify.XXXXXXXX")"
          trap 'rm -rf "$work"' EXIT
          encrypted="$work/creative-logic-release.p12.enc"
          recovered="$work/creative-logic-release.p12"
          certificate="$work/public-certificate.pem"

          printf '%s' "$ENCRYPTED_BACKUP_BASE64" | base64 --decode > "$encrypted"

          # Pin the exact encrypted key generated by bootstrap run 38308855572.
          expected_encrypted_sha256="dbada531b7797fc8df0748de8e018926c70072d2edb69525fcb1e175af16033b"
          actual_encrypted_sha256="$(sha256sum "$encrypted" | cut -d' ' -f1)"
          if [[ "$actual_encrypted_sha256" != "$expected_encrypted_sha256" ]]; then
            echo "::error::The stored encrypted backup does not match the original signing backup."
            exit 1
          fi

          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in "$encrypted" -out "$recovered" -pass env:BACKUP_PASSPHRASE

          # Confirm that this password opens the private signing key.
          keytool -list -storetype PKCS12 \
            -keystore "$recovered" -alias creative-logic-release \
            -storepass:env KEYSTORE_PASSWORD > /dev/null

          keytool -exportcert -rfc -storetype PKCS12 \
            -keystore "$recovered" -alias creative-logic-release \
            -storepass:env KEYSTORE_PASSWORD -file "$certificate" > /dev/null

          # A certificate fingerprint is public information, unlike the signing key.
          expected_fingerprint="sha256 Fingerprint=83:C5:00:19:5D:70:5A:AF:21:9B:66:D9:22:BB:D9:6D:72:ED:F1:FA:3D:A3:2D:09:13:35:D7:FB:F4:62:AC:34"
          actual_fingerprint="$(openssl x509 -in "$certificate" -noout -fingerprint -sha256)"
          if [[ "$actual_fingerprint" != "$expected_fingerprint" ]]; then
            echo "::error::Signing certificate differs from the original bootstrap certificate."
            exit 1
          fi

          {
            echo "## Original Creative Logic signing key verified"
            echo ""
            echo "- Encrypted backup SHA-256 matches bootstrap run 38308855572."
            echo "- Decryption with the private GitHub backup passphrase succeeded."
            echo "- Private key unlocked with the private keystore password."
            echo "- Public certificate fingerprint matches the original certificate."
            echo ""
            echo "No APK was built; no unencrypted key or passwords were uploaded."
          } >> "$GITHUB_STEP_SUMMARY"
