name: Bootstrap Creative Logic signing key

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creative-logic-signing-bootstrap
  cancel-in-progress: false

jobs:
  create-encrypted-keystore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate, encrypt, and test backup
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.CREATIVE_LOGIC_KEYSTORE_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.CREATIVE_LOGIC_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077

          if [[ -f ".github/signing/creative-logic-release.p12.enc" ]]; then
            echo "An encrypted signing key is already recorded. Refusing to generate another."
            exit 1
          fi
          if (( ${#KEYSTORE_PASSWORD} < 24 || ${#BACKUP_PASSPHRASE} < 32 )); then
            echo "Signing or backup secret is missing or shorter than required."
            exit 1
          fi

          work="$RUNNER_TEMP/creative-logic-signing"
          out="$GITHUB_WORKSPACE/signing-backup-output"
          mkdir -p "$work" "$out"

          keytool -genkeypair -noprompt \
            -alias creative-logic-release \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=Creative Logic Mobile, O=Creative Logic Mobile, C=US" \
            -storetype PKCS12 \
            -keystore "$work/creative-logic-release.p12" \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEYSTORE_PASSWORD

          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 \
            -in "$work/creative-logic-release.p12" \
            -out "$out/creative-logic-release.p12.enc" \
            -pass env:BACKUP_PASSPHRASE

          # Verify recovery before uploading. Decrypted bytes stay on the runner.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in "$out/creative-logic-release.p12.enc" \
            -out "$work/recovered.p12" \
            -pass env:BACKUP_PASSPHRASE
          cmp -s "$work/creative-logic-release.p12" "$work/recovered.p12"

          # Only public certificate data and encrypted bytes become artifacts.
          keytool -exportcert -rfc -alias creative-logic-release \
            -keystore "$work/recovered.p12" -storetype PKCS12 \
            -storepass:env KEYSTORE_PASSWORD \
            -file "$out/creative-logic-public-certificate.pem"
          openssl x509 -in "$out/creative-logic-public-certificate.pem" \
            -noout -fingerprint -sha256 > "$out/CERTIFICATE-SHA256.txt"
          (cd "$out" && sha256sum creative-logic-release.p12.enc > ENCRYPTED-SHA256.txt)

          echo "Encrypted keystore created and recovery tested." >> "$GITHUB_STEP_SUMMARY"
          echo "Only the encrypted .p12.enc file, its checksum, and PUBLIC certificate information were uploaded." >> "$GITHUB_STEP_SUMMARY"
          echo "Download and preserve the encrypted backup before using this key for builds." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload encrypted backup only
        uses: actions/upload-artifact@v4
        with:
          name: creative-logic-encrypted-signing-backup
          path: signing-backup-output/
          if-no-files-found: error
          retention-days: 30
