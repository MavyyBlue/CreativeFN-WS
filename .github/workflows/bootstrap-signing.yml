name: Bootstrap Creative Logic signing key

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: creative-logic-signing-bootstrap
  cancel-in-progress: false

jobs:
  create-encrypted-keystore:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Guard against accidental key regeneration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          if os.environ['GITHUB_RUN_ATTEMPT'] != '1':
              raise SystemExit('Refusing to regenerate the signing key during a job rerun.')

          repo = os.environ['GITHUB_REPOSITORY']
          run_id = int(os.environ['GITHUB_RUN_ID'])
          url = (f'https://api.github.com/repos/{repo}/actions/workflows/'
                 'bootstrap-signing.yml/runs?per_page=100')
          request = Request(url, headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urlopen(request, timeout=20) as response:
              runs = json.load(response)['workflow_runs']

          if any(run['id'] != run_id and run.get('conclusion') == 'success'
                 for run in runs):
              raise SystemExit('Signing bootstrap previously succeeded: refusing to make another key.')
          print('No previous successful signing bootstrap found.')
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate, encrypt, and test backup
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.CREATIVE_LOGIC_KEYSTORE_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.CREATIVE_LOGIC_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077

          if [[ -f '.github/signing/creative-logic-release.p12.enc' ]]; then
            echo 'Signing key already recorded. Refusing to generate another.'
            exit 1
          fi
          if (( ${#KEYSTORE_PASSWORD} < 24 || ${#BACKUP_PASSPHRASE} < 32 )); then
            echo 'Signing or backup secret is missing or shorter than required.'
            exit 1
          fi

          work="$RUNNER_TEMP/creative-logic-signing"
          out="$GITHUB_WORKSPACE/signing-backup-output"
          mkdir -p "$work" "$out"

          keytool -genkeypair -noprompt \
            -alias creative-logic-release \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname 'CN=Creative Logic Mobile, O=Creative Logic Mobile, C=US' \
            -storetype PKCS12 \
            -keystore "$work/creative-logic-release.p12" \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEYSTORE_PASSWORD

          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 \
            -in "$work/creative-logic-release.p12" \
            -out "$out/creative-logic-release.p12.enc" \
            -pass env:BACKUP_PASSPHRASE

          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in "$out/creative-logic-release.p12.enc" \
            -out "$work/recovered.p12" \
            -pass env:BACKUP_PASSPHRASE
          cmp -s "$work/creative-logic-release.p12" "$work/recovered.p12"

          keytool -exportcert -rfc -alias creative-logic-release \
            -keystore "$work/recovered.p12" -storetype PKCS12 \
            -storepass:env KEYSTORE_PASSWORD \
            -file "$out/creative-logic-public-certificate.pem"
          openssl x509 -in "$out/creative-logic-public-certificate.pem" \
            -noout -fingerprint -sha256 > "$out/CERTIFICATE-SHA256.txt"
          (cd "$out" && sha256sum creative-logic-release.p12.enc > ENCRYPTED-SHA256.txt)

          echo 'Encrypted keystore created and recovery tested.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Only encrypted bytes and public certificate details are uploaded.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the backup, keep both passwords, and preserve an independent copy.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload encrypted backup only
        uses: actions/upload-artifact@v4
        with:
          name: creative-logic-encrypted-signing-backup
          path: signing-backup-output/
          if-no-files-found: error
          retention-days: 30
